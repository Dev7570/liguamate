services:
  - type: web
    name: linguamate-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./linguamate.db
      - key: FRONTEND_URL
        value: https://liguamate.vercel.app
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "false"
